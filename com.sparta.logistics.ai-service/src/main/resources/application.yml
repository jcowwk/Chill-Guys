spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST_AI}/team7
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Gemini 응답 지연 시 호출 스레드가 Feign 기본 read timeout(60s)까지 묶이지 않도록 제한
  # (기존 spring.feign.hystrix 설정은 경로가 잘못되었고 Hystrix 도 지원 종료되어 동작하지 않았음)
  cloud:
    openfeign:
      client:
        config:
          ai-service:           # GeminiClient
            connectTimeout: 2000
            readTimeout: 5000

  management:
    endpoints:
      web:
        exposure:
          include: "*"
    health:
      diskspace:
        enabled: true
      db:
        enabled: true

server:
  port: 19097

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_URL}/eureka/
    register-with-eureka: true
    fetch-registry: true

gemini:
  api:
    baseurl: ${GEMINI_BASEURL}
    key: ${GOOGLE_AI_API_KEY}