server:
  port: 19095

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: product-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    # 서비스별 DB 분리 (MSA): 상품은 자기 DB(product-db)만 사용한다
    url: jdbc:postgresql://${POSTGRES_HOST_PRODUCT}/team7
  jpa:
    hibernate:
      ddl-auto: update   # 시작할 때 테이블이 없으면 생성, 있으면 데이터 유지
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
        use_sql_comments: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_URL}/eureka/