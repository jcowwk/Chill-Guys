spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: slack-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST_SLACK}/team7
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  feign:
    hystrix:
      enabled: true
    client:
      config:
        default:
          loggerLevel: full

  management:
    endpoints:
      web:
        exposure:
          include: "*"
    health:
      diskspace:
        enabled: true
      db:
        enabled: true

  kafka:
    # 컨슈머/DLT 프로듀서/토픽 생성(KafkaAdmin) 공통 주소
    bootstrap-servers: ${KAFKA_SERVER_URL:localhost:9092}

server:
  port: 19099

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_URL}/eureka/
    register-with-eureka: true
    fetch-registry: true

slack:
  bot:
    token: ${SLACK_BOT_TOKEN}
  api:
    url: ${SLACK_API_URL}

# Kafka 컨슈머 장애 대응: 지수 백오프 재시도 후 <topic>.DLT 로 격리
kafka:
  consumer:
    retry:
      max-retries: 3
      initial-interval-ms: 1000
      max-interval-ms: 10000
