spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: slack-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST_SLACK}/team7
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  # 시작할 때 schema.sql 실행 (CREATE TABLE IF NOT EXISTS). DDL_AUTO 가 none 이어도 새 테이블이 생긴다.
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true   # Hibernate DDL 이 먼저, 그다음 schema.sql
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Feign 기본값(connect 10s / read 60s)이면 외부 장애 시 Kafka 컨슈머 스레드가 오래 묶이므로 호출 대상별 timeout 지정
  # (기존 spring.feign.hystrix 설정은 경로가 잘못되었고 Hystrix 도 지원 종료되어 동작하지 않았음)
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
          ai-service:
            connectTimeout: 1000
            readTimeout: 7000   # ai-service 내부 Gemini readTimeout(5s) + 여유
          slack-service:        # Slack Web API (SlackClient)
            connectTimeout: 2000
            readTimeout: 3000

  kafka:
    # 컨슈머/DLT 프로듀서/토픽 생성(KafkaAdmin) 공통 주소
    bootstrap-servers: ${KAFKA_SERVER_URL:localhost:9092}
    admin:
      operation-timeout: 10s   # Kafka 미기동 시 DLT 토픽 생성 확인 때문에 기동이 오래 지연되지 않도록

server:
  port: 19099

# 지표는 서비스 포트와 다른 관리 포트로만 공개한다.
# 관리 포트는 Eureka 에 등록되지 않으므로 Gateway 를 통해 외부로 노출되지 않는다.
# (기존 설정은 spring: 아래에 잘못 들어가 적용되지 않았고, 모든 엔드포인트("*") 공개였음)
management:
  server:
    port: ${MANAGEMENT_PORT:29099}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        spring.kafka.listener: true   # 알림 1건 처리 시간 p95 를 보기 위해

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_URL}/eureka/
    register-with-eureka: true
    fetch-registry: true

slack:
  bot:
    token: ${SLACK_BOT_TOKEN}
  # Slack chat.postMessage 호출 한도(채널당 대략 초당 1건)에 맞춘 발송 간격
  rate-limit:
    per-channel-interval-ms: 1000
    max-wait-ms: 20000          # 이보다 오래 기다려야 하면 재시도로 넘김 (컨슈머 스레드를 오래 잡지 않도록)
  api:
    url: ${SLACK_API_URL}

# Kafka 컨슈머 장애 대응: 지수 백오프 재시도 후 <topic>.DLT 로 격리
kafka:
  consumer:
    concurrency: 3          # 리스너당 스레드 수 (= delivery-service kafka.topic.partitions 이하)
    max-poll-records: 10    # 느린 외부 API 로 max.poll.interval(5분) 초과 → 리밸런스 폭주 방지
    processed-event:
      retention-days: 7     # 멱등 처리 이력 보관 기간 (Kafka 토픽 retention 이상이어야 함)
    retry:
      max-retries: 3
      initial-interval-ms: 1000
      max-interval-ms: 10000
  dlt:
    replay:
      max-replay-count: 3   # 같은 메시지를 DLT 에서 재투입할 수 있는 최대 횟수 (무한 루프 방지)
