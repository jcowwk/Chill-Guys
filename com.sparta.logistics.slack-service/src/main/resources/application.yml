spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: slack-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST_SLACK}/team7
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Feign 기본값(connect 10s / read 60s)이면 외부 장애 시 Kafka 컨슈머 스레드가 오래 묶이므로 호출 대상별 timeout 지정
  # (기존 spring.feign.hystrix 설정은 경로가 잘못되었고 Hystrix 도 지원 종료되어 동작하지 않았음)
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
          ai-service:
            connectTimeout: 1000
            readTimeout: 7000   # ai-service 내부 Gemini readTimeout(5s) + 여유
          slack-service:        # Slack Web API (SlackClient)
            connectTimeout: 2000
            readTimeout: 3000

  management:
    endpoints:
      web:
        exposure:
          include: "*"
    health:
      diskspace:
        enabled: true
      db:
        enabled: true

  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: my-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 19099

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_URL}/eureka/
    register-with-eureka: true
    fetch-registry: true

slack:
  bot:
    token: ${SLACK_BOT_TOKEN}
  api:
    url: ${SLACK_API_URL}