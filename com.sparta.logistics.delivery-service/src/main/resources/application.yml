spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST_DELIVERY}/team7
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # 시작할 때 schema.sql 실행 (CREATE TABLE IF NOT EXISTS). DDL_AUTO 가 none 이어도 새 테이블이 생긴다.
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true   # Hibernate DDL 이 먼저, 그다음 schema.sql
    hibernate:
      ddl-auto: ${DDL_AUTO}
  kafka:
    bootstrap-servers: ${KAFKA_SERVER_URL:localhost:9092}
    admin:
      operation-timeout: 10s   # Kafka 미기동 시 토픽 생성 확인 때문에 기동이 오래 지연되지 않도록
  task:
    scheduling:
      pool:
        size: 4   # 배정 스케줄러, Outbox 릴레이, 지표 갱신이 서로를 막지 않도록 분리

server:
  port: 19094

# 지표는 서비스 포트와 다른 관리 포트로만 공개한다.
# 관리 포트는 Eureka 에 등록되지 않으므로 Gateway 를 통해 외부로 노출되지 않는다.
management:
  server:
    port: ${MANAGEMENT_PORT:29094}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_URL}/eureka/

# Transactional Outbox 릴레이 설정
outbox:
  relay:
    fixed-delay-ms: 3000      # 발행 주기
    batch-size: 500           # 부하 테스트: 100 → 761/s, 500 → 1100/s, 1000 → 1152/s
    max-drain-ms: 10000       # 적체 시 한 주기에 연속 발행하는 최대 시간
    send-timeout-ms: 20000    # max.block(5s) + delivery.timeout(10s) 보다 길게
    max-retries: 10           # 영구 오류(직렬화/메시지 크기 등)일 때만 적용, 브로커 장애는 무기한 재시도
    base-backoff-ms: 5000
    max-backoff-ms: 300000
    retention-days: 7         # PUBLISHED 이벤트 보관 기간

kafka:
  topic:
    partitions: 3   # = slack-service 컨슈머 병렬 처리 상한
    replicas: 1     # 브로커 1대 구성 (브로커 수보다 크면 토픽 생성 실패)
    min-insync-replicas: 1   # 복제본 수 이하 (더 크면 acks=all 발행이 계속 실패)

# 배송 담당자 배정 스케줄러 (건별 트랜잭션)
delivery:
  cancellation:
    retention-days: 30    # 주문 단위 배송 취소 표시 보관 기간 (늦게 온 배송 생성 거절용)
  assignment:
    batch-size: 200       # 한 번에 조회하는 대기 건 수 (ID 만 조회)
    max-run-ms: 50000     # 한 번 실행의 최대 시간 (스케줄 주기 60초보다 짧게)
    concurrency: 4        # 동시 처리 수 (건별 커밋이라 순차 처리 시 처리량 1/3 - 부하 테스트)
